name: CI Frontend & Build Validation

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - '.agents/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - '.agents/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

jobs:
  validate-frontend:
    name: Build & Quality Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
      PYTHONPATH: "."
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Verify Skills Documentation (Rule 1 skills-sync)
        run: python .agents/scripts/verify_skills_documentation.py

      - name: Verify Data Integrity (8/8 Checks)
        run: python data_integrity_check.py

      - name: Run Production Build (Vite)
        run: npm run build
