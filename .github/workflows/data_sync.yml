name: Automated Match Data Sync & Live Refresh

on:
  schedule:
    # Vendredis, Samedis et Dimanches (Top 5 Leagues) : toutes les 2h entre 12h UTC et 23h UTC
    - cron: '0 12,14,16,18,20,22 * * 5,6,0'
    # Mardis, Mercredis et Jeudis (Coupes d'Europe) : 12h, 17h, 19h, 21h et 23h UTC
    - cron: '0 12,17,19,21,23 * * 2,3,4'
    # Contrôle quotidien matinal : 06h00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch: # Permet de déclencher la mise à jour manuellement en 1 clic sur GitHub

permissions:
  contents: write

jobs:
  sync-live-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node.js dependencies
        run: npm ci || npm install

      - name: Ingest Live Matches & Events (2026-2027)
        run: python scripts/pipeline/ingest_historical_and_live_matches.py --live-only --force-refresh

      - name: Ingest Real Betclic Odds
        run: |
          npx puppeteer browsers install chrome || true
          python scripts/pipeline/extractors/betclic_collector.py || true

      - name: Compile Unified History and App Data
        run: python scripts/pipeline/compile_unified_history_and_app_data.py

      - name: Enrich Matches with Quant ML and Entities
        run: python scripts/pipeline/enrich_matches_with_ml_and_entities.py

      - name: Synchronize Multi-Season Squads & Transfermarkt Database
        run: python scripts/pipeline/sync_full_squads_and_transfers.py

      - name: Assert Odds Retention
        run: |
          python -c "import json; d = json.load(open('src/data/app_data.json', encoding='utf-8')); active = [m for m in d.get('fullSchedule', []) if m.get('oddsStatus') == 'ACTIVE' and m.get('betclicOdds')]; print(f'Active certified odds in app_data.json: {len(active)}'); assert len(active) >= 10, f'CRITICAL: Odds regression! Only {len(active)} active odds found.'"

      - name: Validate Data Quality Contract
        run: npm run data:validate

      - name: Validate Frontend Production Build
        run: npm run build

      - name: Commit and Push Changes to GitHub
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --staged --quiet; then
            echo 'Aucune nouvelle donnee a commiter.'
          else
            git commit -m 'chore(data): automated match sync and compilation [skip ci]'
            git pull --rebase --autostash origin main || git pull origin main --no-rebase -X theirs --no-edit || true
            git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:main
          fi
