name: Automated Match Data Sync & Live Refresh

on:
  schedule:
    # Vendredis, Samedis et Dimanches (Top 5 Leagues) : toutes les 2h entre 12h UTC et 23h UTC
    - cron: '0 12,14,16,18,20,22 * * 5,6,0'
    # Mardis, Mercredis et Jeudis (Coupes d\'Europe) : 19h, 21h et 23h UTC
    - cron: '0 19,21,23 * * 2,3,4'
    # Contrôle quotidien matinal : 06h00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch: # Permet de déclencher la mise à jour manuellement en 1 clic sur GitHub

permissions:
  contents: write

jobs:
  sync-live-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ingest Live Matches & Events (2026-2027)
        run: python scripts/pipeline/ingest_historical_and_live_matches.py --live-only --force-refresh

      - name: Compile Unified History and App Data
        run: python scripts/pipeline/compile_unified_history_and_app_data.py

      - name: Compile Fast-Layer Client Rosters
        run: python scripts/pipeline/compile_client_rosters.py

      - name: Commit and Push Changes to GitHub
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/data/ data/raw/
          if git diff --staged --quiet; then
            echo 'Aucune nouvelle donnee a commiter.'
          else
            git commit -m 'chore(data): automated match sync and compilation [skip ci]'
            git push
          fi
